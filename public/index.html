<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aethel Control Center</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --surface-color: #131b2e;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    header { background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); padding: 16px; display: flex; align-items: center; justify-content: space-between; }
    .header-info h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
    .header-info p { font-size: 0.75rem; color: var(--text-muted); }
    .status-indicator { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .console-card { background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; }
    .console-card h3 { font-size: 0.85rem; color: var(--accent-color); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .console-card p { font-size: 0.9rem; color: var(--text-main); line-height: 1.4; }
    nav { background-color: var(--surface-color); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 4px env(safe-area-inset-bottom, 8px); }
    .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; padding: 8px 0; cursor: pointer; transition: color 0.2s ease; }
    .nav-item.active { color: var(--accent-color); }
    .nav-item span { font-size: 0.65rem; font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <div class="header-info">
      <h1 id="header-title">Corporate</h1>
      <p id="header-subtitle">Executive Control & Oversight</p>
    </div>
    <div class="status-indicator" title="System Online"></div>
  </header>
  <main id="content-feed">
    <div class="console-card">
      <h3>System Initialized</h3>
      <p>Aethel secure wrapper online. Ready to interface with multi-agent backend core.</p>
    </div>
  </main>
  <nav id="bottom-nav"></nav>
  <script type="module" src="app.js"></script>
</body>
</html>
